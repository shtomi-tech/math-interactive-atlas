name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages input files
        run: |
          test -f atlas.html
          test -f index.html
          test -f practice.html
          test -f sets.html
          test -f worksheet.html
          test -f progress.html
          test -f static/tokens.css
          test -f static/atlas.css
          test -f static/atlas/main.js
          test -f static/atlas/content-data.json
          test -f interactions.html
          test -f data/interactions.json
          test -f data/interaction-runtime-map.json
          test -f research/external-repositories.json
          test -f static/library.css
          test -f static/library/main.js
          test -f static/library/catalog.js
          test -f static/library/viewer.js
          test -f static/atlas/interactions/sequence-lab.js
          test -f static/atlas/math/exponential-logarithm.js
          test -f static/atlas/math/calculus.js
          test -f static/atlas/math/sequences.js
          test -f static/atlas/math/algebra2.js
          test -f static/atlas/math/coordinate-geometry.js
          test -f static/atlas/math/statistical-inference.js
          test -f static/atlas/math/sampling.js
          test -f static/atlas/math/modeling.js
          test -f static/atlas/interactions/function-scenes/index.js
          test -f static/atlas/interactions/geometry-scenes/index.js
          test -f static/practice.css
          test -f static/practice/main.js
          test -f static/practice/problem-data.json
          test -f static/asset-version.txt
          test -f research/repository-audit.json
          test -f static/practice/filter.js
          test -f static/practice/session.js
          test -f static/sets.css
          test -f static/sets/main.js
          test -f static/sets/model.js
          test -f static/sets/storage.js
          test -f static/sets/io.js
          test -f static/worksheet.css
          test -f static/worksheet/main.js
          test -f static/worksheet/model.js
          test -f static/progress.css
          test -f static/progress/main.js
          test -f static/progress/summary.js
          test -f static/progress/record.js
      - name: Prepare static files
        run: |
          mkdir -p _site/static
          cp atlas.html interactions.html index.html practice.html sets.html worksheet.html progress.html _site/
          cp static/tokens.css static/atlas.css static/practice.css _site/static/
          cp static/sets.css static/worksheet.css static/progress.css _site/static/
          cp static/library.css _site/static/
          cp static/asset-version.txt _site/static/
          cp -R research _site/research
          cp -R data _site/data
          cp -R dist _site/dist
          cp -R static/atlas _site/static/atlas
          cp -R static/library _site/static/library
          cp -R static/practice _site/static/practice
          cp -R static/sets _site/static/sets
          cp -R static/worksheet _site/static/worksheet
          cp -R static/progress _site/static/progress
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for path in / /atlas.html /practice.html /sets.html /worksheet.html /progress.html; do
            curl --fail --silent --show-error "$PAGE_URL$path" >/dev/null
          done
      - name: Set up Node.js for browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser smoke dependencies
        run: npm ci
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Read expected asset version
        id: asset-version
        run: echo "value=$(tr -d '\r\n' < static/asset-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Browser regression deployed Pages
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_ASSET_VERSION: ${{ steps.asset-version.outputs.value }}
        run: >-
          npx playwright test
          tests/e2e/canonical-library.spec.js
          tests/e2e/pages-smoke.spec.js
          tests/e2e/all-atlas-content.spec.js
          tests/e2e/learning-loop.spec.js
          tests/e2e/responsive.spec.js
