name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages input files
        run: |
          test -f atlas.html
          test -f index.html
          test -f practice.html
          test -f static/tokens.css
          test -f static/atlas.css
          test -f static/atlas/main.js
          test -f static/atlas/content-data.json
          test -f static/practice.css
          test -f static/practice/main.js
          test -f static/practice/problem-data.json
          test -f static/practice/filter.js
          test -f static/practice/session.js
      - name: Prepare static files
        run: |
          mkdir -p _site/static
          cp atlas.html index.html practice.html _site/
          cp static/tokens.css static/atlas.css static/practice.css _site/static/
          cp -R static/atlas _site/static/atlas
          cp -R static/practice _site/static/practice
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
