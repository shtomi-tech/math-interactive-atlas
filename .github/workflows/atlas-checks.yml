name: Atlas checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run atlas contract checks
        run: |
          node scripts/check-atlas-contract.js
          node scripts/check-set-regions.js
          node scripts/check-set-relations.js
          node scripts/check-event-regions.js
          node scripts/check-conditional-probability.js
          node scripts/check-combinatorics.js
          node scripts/check-statistics.js
          node scripts/check-probability.js
          node scripts/check-geometry.js
          node scripts/check-algebra.js
          node scripts/check-number-line.js
          node scripts/check-sample-space.js
          node scripts/check-number-theory.js
          node scripts/check-quadratic.js
          node scripts/check-trigonometry.js
          node scripts/check-curriculum.js
          node scripts/check-related-content.js
          node scripts/check-hypothesis-test.js
          node scripts/check-practice-data.js
          node scripts/check-practice-answer.js
          node scripts/check-practice-links.js
          node scripts/check-practice-coverage.js
          node scripts/check-practice-quality.js
          node scripts/check-practice-session.js
          node scripts/check-learning-state.js
          node scripts/check-problem-set.js
          node scripts/check-set-storage.js
          node scripts/check-worksheet.js
          node scripts/check-progress-summary.js
          node scripts/check-learning-record.js
          node scripts/check-asset-version.js
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check static/atlas/main.js
          node --check static/atlas/catalog.js
          node --check static/atlas/viewer.js
          node --check static/atlas/router.js
          node --check static/atlas/interactions/index.js
          node --check static/atlas/interactions/function-graph.js
          node --check static/atlas/interactions/range-graph.js
          node --check static/atlas/interactions/geometry-board.js
          node --check static/atlas/interactions/region-selector.js
          node --check static/atlas/interactions/combinatorics-viewer.js
          node --check static/atlas/interactions/data-lab.js
          node --check static/atlas/interactions/simulation-lab.js
          node --check static/atlas/math/set-regions.js
          node --check static/atlas/math/set-relations.js
          node --check static/atlas/math/event-regions.js
          node --check static/atlas/math/conditional-probability.js
          node --check static/atlas/math/combinatorics.js
          node --check static/atlas/math/statistics.js
          node --check static/atlas/math/probability.js
          node --check static/atlas/math/geometry.js
          node --check static/atlas/interactions/algebra-lab.js
          node --check static/atlas/interactions/number-line-lab.js
          node --check static/atlas/interactions/algorithm-lab.js
          node --check static/atlas/math/algebra.js
          node --check static/atlas/math/number-line.js
          node --check static/atlas/math/sample-space.js
          node --check static/atlas/math/number-theory.js
          node --check static/atlas/interactions/function-graph.js
          node --check static/atlas/curriculum.js
          node --check static/atlas/math/quadratic.js
          node --check static/atlas/math/trigonometry.js
          node --check static/atlas/math/hypothesis-test.js
          node --check static/atlas/storage.js
          node --check static/practice/main.js
          node --check static/practice/router.js
          node --check static/practice/catalog.js
          node --check static/practice/runner.js
          node --check static/practice/answer.js
          node --check static/practice/validation.js
          node --check static/practice/filter.js
          node --check static/practice/session.js
          node --check static/sets/main.js
          node --check static/sets/model.js
          node --check static/sets/storage.js
          node --check static/sets/io.js
          node --check static/worksheet/main.js
          node --check static/worksheet/model.js
          node --check static/progress/main.js
          node --check static/progress/summary.js
          node --check static/progress/record.js
